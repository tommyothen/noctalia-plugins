# Bongo Cat. A cat that sits in your bar and slaps when you type or to the beat.
#
# Fork of noctalia/bongocat 1.1.4 (MIT). Upstream needs `input_devices` set by
# hand and expects a stable /dev/input/by-id or by-path entry. That falls apart
# under a key remapper: keyd, kmonad, evremap and xremap grab the physical
# keyboard and replay every keystroke on a uinput device that has no by-id or
# by-path symlink at all, so the only path that carries events is an unstable
# /dev/input/eventN. This fork finds the keyboards itself and rescans while it
# runs, and shows your typing speed next to the cat. See README.md.
#
# Requirements: `evtest` installed and your user in the `input` group.
# Audio reactivity uses the PipeWire spectrum.

id = "tommyothen/bongocat"
name = "Bongo Cat"
version = "1.0.0"
plugin_api = 3
author = "tommyothen"
license = "MIT"
dependencies = ["evtest"]
icon = "cat"
description = "A cat that slaps your bar when you type or to the beat, and counts your words per minute while it does. Finds your keyboard on its own, remapper included."
tags = ["fun", "animation"]

[[widget]]
id = "cat"
entry = "bongocat.luau"

  [[widget.setting]]
  key = "auto_detect"
  type = "bool"
  label_key = "settings.auto_detect.label"
  description_key = "settings.auto_detect.description"
  default = true

  [[widget.setting]]
  key = "input_devices"
  type = "string_list"
  label_key = "settings.input_devices.label"
  description_key = "settings.input_devices.description"
  default = []

  [[widget.setting]]
  key = "executable_path"
  type = "file"
  label_key = "settings.executable_path.label"
  default = "evtest"

  [[widget.setting]]
  key = "show_wpm"
  type = "bool"
  label_key = "settings.show_wpm.label"
  description_key = "settings.show_wpm.description"
  default = true

  [[widget.setting]]
  key = "audio_spectrum"
  type = "bool"
  label_key = "settings.audio_spectrum.label"
  default = false

  [[widget.setting]]
  key = "tappy_mode"
  type = "bool"
  label_key = "settings.tappy_mode.label"
  default = false
  visible_when = { key = "audio_spectrum", values = ["true"] }

  [[widget.setting]]
  key = "rave_mode"
  type = "bool"
  label_key = "settings.rave_mode.label"
  default = false
  visible_when = { key = "audio_spectrum", values = ["true"] }

  [[widget.setting]]
  key = "use_mpris_filter"
  type = "bool"
  label_key = "settings.use_mpris_filter.label"
  default = false
  visible_when = { key = "audio_spectrum", values = ["true"] }
